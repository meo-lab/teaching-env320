<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Overview of geospatial data sources</title>
  <desc id="desc">A globe surrounded by Remote Sensing, Geo-information Systems, and Models and Re-analysis Products.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#00457c" flood-opacity="0.16" />
    </filter>
  </defs>
  <g fill="none" stroke="#aeb8c0" stroke-width="3">
    <path d="M285 91 C350 91 360 120 385 143" />
    <path d="M675 91 C610 91 600 120 575 143" />
    <path d="M480 292 L480 316" />
  </g>
  <g filter="url(#shadow)">
    <rect x="24" y="42" width="270" height="98" rx="16" fill="#00457c" />
    <text x="159" y="81" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Remote Sensing</text>
    <text x="159" y="112" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">Optical · Radar</text>
    <rect x="666" y="42" width="270" height="98" rx="16" fill="#f2c300" />
    <text x="801" y="83" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Geo-information</text>
    <text x="801" y="112" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Systems (GIS)</text>
    <rect x="310" y="310" width="340" height="62" rx="16" fill="#4f50ba" />
    <text x="480" y="336" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Models and Re-analysis</text>
    <text x="480" y="360" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Products</text>
  </g>
</svg>
