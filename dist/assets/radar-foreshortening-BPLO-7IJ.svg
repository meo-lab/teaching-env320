<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <pattern id="shadowHatch" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#303050" stroke-width="2" opacity="0.45"/>
    </pattern>
    <marker id="arrowBl" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00457c"/>
    </marker>
    <marker id="arrowDk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444"/>
    </marker>
    <marker id="arrowOr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c07000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="540" fill="#f6f8fb" rx="12"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1a2a3a" letter-spacing="0.2">Radar Geometric Distortions: Foreshortening, Layover &amp; Shadow</text>
  <line x1="60" y1="42" x2="760" y2="42" stroke="#ccd5e0" stroke-width="1"/>

  <!-- Sky background -->
  <rect x="60" y="52" width="700" height="262" rx="8" fill="#daeaf7" opacity="0.55"/>

  <!-- ──────────────────────────────────────
       TERRAIN ZONES (fill polygons)
  ────────────────────────────────────── -->

  <!-- Normal flat left zone -->
  <polygon points="60,360 190,360 190,430 60,430" fill="#7aaa7a" opacity="0.55"/>
  <polygon points="60,360 190,360 190,380 60,380" fill="#6a9a6a" opacity="0.6"/>

  <!-- Foreshortening zone — lower left slope -->
  <polygon points="190,360 310,210 310,430 190,430" fill="#e8a030" opacity="0.75"/>

  <!-- Layover zone — steep upper left slope -->
  <polygon points="310,210 375,140 375,430 310,430" fill="#c0392b" opacity="0.70"/>

  <!-- Shadow zone — right slope and far terrain -->
  <polygon points="375,140 480,360 760,360 760,430 375,430" fill="#1a1a2e" opacity="0.30"/>
  <polygon points="375,140 480,360 760,360 760,430 375,430" fill="url(#shadowHatch)"/>

  <!-- Terrain silhouette (top) -->
  <polyline points="60,360 190,360 310,210 375,140 480,360 760,360"
            fill="none" stroke="#2a3a2a" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Ground base -->
  <line x1="60" y1="430" x2="760" y2="430" stroke="#2a3a2a" stroke-width="1.8"/>
  <!-- Vertical sides -->
  <line x1="60" y1="360" x2="60" y2="430" stroke="#2a3a2a" stroke-width="1.5"/>
  <line x1="760" y1="360" x2="760" y2="430" stroke="#2a3a2a" stroke-width="1.5"/>

  <!-- ──────────────────────────────────────
       RADAR SENSOR
  ────────────────────────────────────── -->
  <g transform="translate(95,82)">
    <rect x="-15" y="-11" width="30" height="22" rx="4" fill="#00457c" stroke="#003060" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="700" fill="white">SAR</text>
    <!-- Solar panels -->
    <rect x="-42" y="-6" width="24" height="12" rx="3" fill="#f2c300" stroke="#a08000" stroke-width="1"/>
    <rect x="18" y="-6" width="24" height="12" rx="3" fill="#f2c300" stroke="#a08000" stroke-width="1"/>
    <!-- Antenna down -->
    <line x1="0" y1="11" x2="0" y2="24" stroke="#bbb" stroke-width="2"/>
    <!-- Label -->
    <text x="0" y="-17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#003060">SAR Sensor</text>
  </g>

  <!-- ──────────────────────────────────────
       RADAR BEAMS
  ────────────────────────────────────── -->
  <!-- To flat left -->
  <line x1="95" y1="106" x2="120" y2="360" stroke="#00457c" stroke-width="1.2" stroke-dasharray="7,5" opacity="0.55"/>
  <!-- To normal zone boundary -->
  <line x1="95" y1="106" x2="190" y2="360" stroke="#00457c" stroke-width="1.5" stroke-dasharray="7,4" opacity="0.75"/>
  <!-- To foreshortening mid-slope -->
  <line x1="95" y1="106" x2="310" y2="210" stroke="#e8a030" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.85"/>
  <!-- To peak / layover top -->
  <line x1="95" y1="106" x2="375" y2="140" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" opacity="0.9"/>
  <!-- Shadow boundary (grazing) -->
  <line x1="95" y1="106" x2="480" y2="360" stroke="#666" stroke-width="1.2" stroke-dasharray="4,5" opacity="0.45"/>

  <!-- ──────────────────────────────────────
       SLANT-RANGE EQUAL-DISTANCE ARCS
       (showing equal time → different ground dist.)
  ────────────────────────────────────── -->
  <!-- These arcs are centered on the radar sensor (95,82) -->
  <!-- Near range arc -->
  <path d="M 60,252 A 200,200 0 0,1 248,138" fill="none" stroke="#00457c" stroke-width="1" stroke-dasharray="3,5" opacity="0.3"/>
  <!-- Mid range arc -->
  <path d="M 60,325 A 270,270 0 0,1 320,185" fill="none" stroke="#00457c" stroke-width="1" stroke-dasharray="3,5" opacity="0.25"/>

  <!-- ──────────────────────────────────────
       ANNOTATIONS ON TERRAIN
  ────────────────────────────────────── -->
  <!-- "Normal" label -->
  <text x="122" y="333" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5a1a">Normal</text>
  <text x="122" y="348" text-anchor="middle" font-size="9" fill="#2a6a2a">flat ground</text>

  <!-- "Foreshortening" label (rotated along slope) -->
  <g transform="translate(255,295)">
    <rect x="-54" y="-15" width="108" height="26" rx="5" fill="#e8a030" opacity="0.85"/>
    <text x="0" y="3" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a2a00">Foreshortening</text>
  </g>

  <!-- "Layover" label -->
  <g transform="translate(344,188)">
    <rect x="-32" y="-14" width="64" height="24" rx="5" fill="#c0392b" opacity="0.85"/>
    <text x="0" y="3" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">Layover</text>
  </g>

  <!-- "Shadow" label -->
  <text x="590" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#9090b0">Shadow</text>
  <text x="590" y="310" text-anchor="middle" font-size="10" fill="#808098">(no radar return)</text>

  <!-- ──────────────────────────────────────
       GROUND DISTANCE VS IMAGE DISTANCE arrows
       showing the compression concept
  ────────────────────────────────────── -->
  <!-- Ground extent of foreshortening slope -->
  <line x1="190" y1="373" x2="375" y2="373" stroke="#e8a030" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowOr)" marker-start="url(#arrowOr)" opacity="0.9"/>
  <text x="282" y="390" text-anchor="middle" font-size="9.5" fill="#a06000" font-weight="600">large ground distance</text>

  <!-- ──────────────────────────────────────
       RANGE DIRECTION INDICATOR
  ────────────────────────────────────── -->
  <g transform="translate(660,65)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#00457c" stroke-width="2" marker-end="url(#arrowBl)"/>
    <text x="27" y="-7" text-anchor="middle" font-size="10" font-weight="700" fill="#003060">range direction</text>
  </g>
  <g transform="translate(660,85)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#555" stroke-width="1.5" marker-end="url(#arrowDk)"/>
    <text x="8" y="18" text-anchor="start" font-size="9" fill="#444">az.</text>
  </g>

  <!-- ──────────────────────────────────────
       SEPARATOR + LABEL
  ────────────────────────────────────── -->
  <line x1="60" y1="448" x2="760" y2="448" stroke="#b0bfd0" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="410" y="445" text-anchor="middle" font-size="9.5" fill="#999" font-style="italic">↓  corresponding radar image (slant-range domain)</text>

  <!-- ──────────────────────────────────────
       RADAR IMAGE STRIP
       Slant-range positions mapped from terrain:
       radar at (95,82); terrain pts → slant range → image x
       Nearest point: slope mid (~x=310,y=210) → near range
       Farthest visible: shadow edge (~x=480,y=360)
  ────────────────────────────────────── -->
  <!-- Image background -->
  <rect x="60" y="458" width="700" height="60" rx="7" fill="#111118"/>

  <!-- ZONE MAPPING (schematic, not to slant-range scale for clarity):
       Normal flat left  → x:60–190  in terrain → x:60–220  in image (slightly compressed by oblique look)
       Foreshortening    → x:190–375 in terrain → x:220–290 in image (strongly compressed)
       Layover           → peak→base  reversed   → x:290–310 in image (very bright, narrow)
       Shadow            → x:375–760 in terrain → x:310–760 in image (dark)
  -->
  <!-- Normal zone -->
  <rect x="60" y="458" width="160" height="60" rx="7" fill="#4a8a4a" opacity="0.85"/>
  <rect x="218" y="458" width="2" height="60" fill="#1a1a28"/>

  <!-- Foreshortening zone (compressed) -->
  <rect x="220" y="458" width="68" height="60" fill="#d8901a" opacity="0.92"/>
  <rect x="286" y="458" width="2" height="60" fill="#1a1a28"/>

  <!-- Layover zone (very compressed, reversed, brightest) -->
  <rect x="288" y="458" width="22" height="60" fill="#e03010" opacity="0.95"/>
  <!-- Reversed-order texture on layover -->
  <line x1="291" y1="458" x2="307" y2="518" stroke="rgba(255,200,180,0.4)" stroke-width="1.5"/>
  <line x1="296" y1="458" x2="299" y2="518" stroke="rgba(255,200,180,0.4)" stroke-width="1.5"/>
  <line x1="302" y1="458" x2="291" y2="518" stroke="rgba(255,200,180,0.4)" stroke-width="1.5"/>
  <rect x="308" y="458" width="2" height="60" fill="#1a1a28"/>

  <!-- Shadow zone (dark, noise only) -->
  <rect x="310" y="458" width="450" height="60" fill="#0d0d1a" rx="0"/>
  <!-- Some noise specks in shadow -->
  <rect x="355" y="468" width="2" height="2" fill="#404050" opacity="0.4"/>
  <rect x="390" y="490" width="1" height="1" fill="#404050" opacity="0.3"/>
  <rect x="440" y="475" width="2" height="1" fill="#404050" opacity="0.3"/>
  <rect x="510" y="500" width="1" height="2" fill="#404050" opacity="0.3"/>
  <rect x="600" y="465" width="2" height="1" fill="#404050" opacity="0.3"/>

  <!-- Round right end -->
  <rect x="758" y="458" width="2" height="60" rx="7" fill="#111118"/>

  <!-- Image strip labels -->
  <text x="140" y="493" text-anchor="middle" font-size="10" font-weight="600" fill="#d0ffd0">Normal</text>
  <text x="254" y="486" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff3d0">Foreshor-</text>
  <text x="254" y="499" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff3d0">tened</text>
  <text x="299" y="491" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffccc0">Lay-</text>
  <text x="299" y="502" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffccc0">over</text>
  <text x="530" y="493" text-anchor="middle" font-size="11" font-weight="700" fill="#383858">Shadow — no return</text>

  <!-- ──────────────────────────────────────
       CONNECTING LINES (terrain → image)
       Schematic mapping arrows
  ────────────────────────────────────── -->
  <!-- Start of foreshortening zone: terrain x=190,y=360 → image x=220 -->
  <line x1="190" y1="430" x2="220" y2="458" stroke="#e8a030" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.7"/>
  <!-- End of foreshortening / layover start: terrain x=310,y=210 → image x=288 -->
  <line x1="310" y1="430" x2="288" y2="458" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.7"/>
  <!-- Peak / shadow boundary: terrain x=375,y=140 → image x=310 -->
  <line x1="375" y1="430" x2="310" y2="458" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- ──────────────────────────────────────
       LEGEND
  ────────────────────────────────────── -->
  <g transform="translate(60, 527)">
    <rect x="0" y="-10" width="11" height="11" rx="2" fill="#4a8a4a"/>
    <text x="15" y="0" font-size="9.5" fill="#333">Normal</text>

    <rect x="75" y="-10" width="11" height="11" rx="2" fill="#d8901a"/>
    <text x="90" y="0" font-size="9.5" fill="#333">Foreshortening (near slope compressed in range)</text>

    <rect x="390" y="-10" width="11" height="11" rx="2" fill="#e03010"/>
    <text x="405" y="0" font-size="9.5" fill="#333">Layover (peak nearer than base → reversed)</text>

    <rect x="650" y="-10" width="11" height="11" rx="2" fill="#0d0d1a" stroke="#555" stroke-width="0.8"/>
    <text x="665" y="0" font-size="9.5" fill="#333">Shadow</text>
  </g>

</svg>
